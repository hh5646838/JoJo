<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOJO茶酒志</title>
  <script>
    // GitHub Pages SPA fallback for project sites (with subpath like /JoJo/)
    // Preserve the original URL and load index.html without changing address bar
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    // For project sites, fetch index.html from the same base path
    const basePath = path.substring(0, path.lastIndexOf('/') + 1);

    // Use history API to preserve URL while loading index.html content
    fetch(basePath + 'index.html' + search + hash)
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        // Fallback: simple redirect if fetch fails
        window.location.href = basePath + 'index.html' + search + hash;
      });
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
