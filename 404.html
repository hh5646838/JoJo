<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOJO茶酒志</title>
  <script>
    // GitHub Pages SPA fallback: preserve original path and redirect to index.html
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    // Store original path in sessionStorage before redirecting
    if (path && path !== '/') {
      sessionStorage.setItem('gh-pages-redirect', path + search + hash);
    }
    
    // Redirect to root (index.html)
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
